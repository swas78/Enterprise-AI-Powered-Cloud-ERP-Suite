name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-typecheck:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend & Frontend Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: TypeScript Compile Check (Backend)
        run: npm run build --prefix backend

      - name: TypeScript Compile Check (Frontend)
        run: npm run build --prefix frontend

      - name: Lint Frontend Code
        run: npm run lint --prefix frontend

  test:
    name: Integration Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Start Redis in Docker
        run: |
          docker run -d --name redis -p 6379:6379 redis:alpine
          # wait for redis
          until docker exec redis redis-cli ping | grep PONG; do
            echo "Waiting for Redis..."
            sleep 1
          done

      - name: Start MongoDB Replica Set in Docker
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6.0 mongod --replSet rs0 --bind_ip_all
          # wait for mongo
          until docker exec mongodb mongosh --eval "db.runCommand({ping: 1})" &>/dev/null; do
            echo "Waiting for MongoDB..."
            sleep 1
          done
          # initiate replica set
          docker exec mongodb mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          # check status
          docker exec mongodb mongosh --eval "rs.status()"

      - name: Run Backend Integration Tests
        run: npm run test:backend
        env:
          DATABASE_URL: mongodb://localhost:27017/amdox-erp?replicaSet=rs0
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: supersecretjwtkeyfordevtesting123
          CSRF_SECRET: supersecretcsrfkeyfordevtesting123
          NODE_ENV: test

  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Express Backend Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: amdox-erp-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build React TS Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: amdox-erp-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build FastAPI Python ML Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: false
          tags: amdox-erp-ml-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scans:
    name: DevOps Security Scanning (Trivy, Snyk, OWASP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Snyk Vulnerability Scanner
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects

      - name: Trivy Container Image Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'amdox-erp-backend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
